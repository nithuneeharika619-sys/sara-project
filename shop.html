<!DOCTYPE html>
<html>
<head>
<title>Sara Shopping 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background: #fff0f5; text-align: center; margin:0; padding:20px; }
h1 { color: #ff1493; }
.container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
.card { background: white; border-radius: 20px; padding: 15px; width: 250px; box-shadow: 0 4px 15px pink; }
.card img { width: 100%; height: 180px; border-radius: 15px; object-fit: cover; }
button { background: #ff69b4; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top:10px; font-weight:bold; }
button:hover { background: #ff1493; }
#cart { position: fixed; top: 10px; right: 10px; background: #ff1493; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; }
a { color: #ff69b4; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div id="cart">🛒 Cart: 0</div>

<h1>Sara's Cute Shop 🛍️💖</h1>
<p>Best collection for you Nithu!</p>

<div class="container">

<div class="card">
<img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=400">
<h3>💄 Pink Lipstick</h3>
<p>Rs. 299</p>
<button onclick="addToCart('Lipstick')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400">
<h3>👗 Cute Dress</h3>
<p>Rs. 999</p>
<button onclick="addToCart('Dress')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400">
<h3>👜 Handbag</h3>
<p>Rs. 599</p>
<button onclick="addToCart('Handbag')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
<h3>👟 Shoes</h3>
<p>Rs. 799</p>
<button onclick="addToCart('Shoes')">Add to Cart</button>
</div>

</div>

<br><br>
<a href="index.html">⬅ Back to Home</a>

<script>
let count = 0;
function addToCart(item){
 count++;
 document.getElementById('cart').innerText = '🛒 Cart: ' + count;
 alert(item + ' added! 🥰 Total: ' + count);
}
</script>
</body>
</html>
